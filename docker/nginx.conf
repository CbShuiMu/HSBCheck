server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Missing parser resources must return 404 instead of the SPA HTML.
    location /assets/ {
        try_files $uri =404;
    }

    location /pdf-assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
